name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make app icon
        run: python3 make_icon.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned
        run: xcodebuild -project GameBrowser.xcodeproj -scheme GameBrowser -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Kitsu.app Payload/
          zip -r Kitsu.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Kitsu-ipa
          path: Kitsu.ipa
